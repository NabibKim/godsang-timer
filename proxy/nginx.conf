# =====================================================================
# gt-proxy 라우팅 설정
# ---------------------------------------------------------------------
#  /api/auth/*       → gt-auth          (PHP, 회원·로그인·세션 발급)
#  /api/timer/*      → timer_pool       (gt-timer_1~3 별칭, Flask, 라운드로빈 로드밸런싱)
#  /api/community/*  → gt-community     (PHP, 게시판)
#  그 외 모든 경로    → gt-front         (정적 HTML/CSS/JS)
#
# 브라우저 입장에서는 모든 요청이 godsang.com 한 곳으로 가므로
# 세션 쿠키(GT_SID)가 모든 API 요청에 자동으로 함께 전송된다.
# =====================================================================

# 도커 내장 DNS 서버(127.0.0.11)로 컨테이너 이름을 IP로 변환한다.
# valid=10s : 10초마다 다시 조회 → 컨테이너가 재시작되어 IP가 바뀌어도 따라감
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------
# upstream : 요청을 받을 서버 묶음
#  - zone    : 여러 워커 프로세스가 서버 상태를 공유하는 메모리 영역 (resolve 사용 시 필수)
#  - resolve : 컨테이너 이름의 IP 변경을 주기적으로 다시 확인
# ---------------------------------------------------------------------
upstream auth_backend {
    zone auth_backend 64k;
    server gt-auth:80 resolve;
}

# timer 는 같은 이미지로 3개 컨테이너(gt-timer_1~3)를 띄우고,
# docker run 의 --network-alias timer_pool 로 세 컨테이너에 "같은 별칭"을 붙였다.
# 도커 DNS 는 timer_pool 을 조회하면 3개 컨테이너의 IP 를 모두 돌려주고,
# nginx 는 그 IP 들을 하나의 묶음으로 보고 라운드로빈(1 → 2 → 3 → 1 ...)으로 요청을 나눈다.
upstream timer_backend {
    zone timer_backend 64k;
    server timer_pool:5000 resolve;
}

upstream community_backend {
    zone community_backend 64k;
    server gt-community:80 resolve;
}

upstream front_backend {
    zone front_backend 64k;
    server gt-front:80 resolve;
}

server {
    listen 80;
    server_name godsang.com localhost _;

    # 게시글 본문 등 요청 크기 제한
    client_max_body_size 1m;

    # 원래 요청 정보를 뒤쪽 서버에 전달 (접속자 IP, 원래 Host 등)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # timer 한 대가 죽어 있으면 다음 서버로 자동 재시도 (장애 대응)
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 3s;

    # ---- API 라우팅 ----
    location /api/auth/ {
        proxy_pass http://auth_backend;
    }

    location /api/timer/ {
        proxy_pass http://timer_backend;
    }

    location /api/community/ {
        proxy_pass http://community_backend;
    }

    # ---- 화면(정적 파일) ----
    location / {
        proxy_pass http://front_backend;
    }
}
