<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갓생 타이머 - 로그인</title>
  <link rel="stylesheet" href="/common/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-title">
        <h1>갓생 타이머</h1>
        <p>오늘의 순공시간을 기록하고 갓생을 증명하세요</p>
      </div>

      <!-- 로그인 / 회원가입 탭 -->
      <div class="tabs">
        <button type="button" class="active" data-tab="login">로그인</button>
        <button type="button" data-tab="signup">회원가입</button>
      </div>

      <!-- ===================== 로그인 폼 ===================== -->
      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login-id">아이디</label>
          <input class="input" id="login-id" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="login-pw">비밀번호</label>
          <input class="input" id="login-pw" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
        <p class="message" id="login-msg"></p>
      </form>

      <!-- ===================== 회원가입 폼 ===================== -->
      <form id="signup-form" class="hidden" autocomplete="off">
        <div class="form-group">
          <label for="signup-id">아이디</label>
          <div class="input-row">
            <input class="input" id="signup-id" type="text" placeholder="영문 소문자+숫자 4~20자">
            <button type="button" class="btn" id="btn-check-id">중복확인</button>
          </div>
          <p class="hint" id="hint-id"></p>
        </div>
        <div class="form-group">
          <label for="signup-pw">비밀번호</label>
          <input class="input" id="signup-pw" type="password" placeholder="영문+숫자 포함 8자 이상" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="signup-pw2">비밀번호 확인</label>
          <input class="input" id="signup-pw2" type="password" autocomplete="new-password">
          <p class="hint" id="hint-pw"></p>
        </div>
        <div class="form-group">
          <label for="signup-name">이름</label>
          <div class="input-row">
            <input class="input" id="signup-name" type="text" placeholder="공백 없이 2~10자">
            <button type="button" class="btn" id="btn-check-name">중복확인</button>
          </div>
          <p class="hint" id="hint-name"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-signup" disabled>가입하기</button>
        <p class="message" id="signup-msg"></p>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/common/api.js"></script>
  <script src="/login.js"></script>
</body>
</html>
