<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갓생 타이머 - 게시글</title>
  <link rel="stylesheet" href="/common/style.css">
</head>
<body>
  <main class="gt-main">

    <!-- ===================== 1. 게시글 본문 ===================== -->
    <article class="card post-detail" id="post-detail">
      <h1 class="post-title" id="post-title"></h1>
      <div class="post-meta">
        <span id="post-author"></span>
        <span id="post-date"></span>
        <span>조회 <b id="post-views">0</b></span>
      </div>
      <div class="post-content" id="post-content"></div>
      <div class="post-actions">
        <a class="btn btn-sm" href="/community/">목록</a>
        <span class="hidden" id="owner-actions">
          <a class="btn btn-sm" id="btn-edit-post" href="#">수정</a>
          <button type="button" class="btn btn-sm btn-danger" id="btn-delete-post">삭제</button>
        </span>
      </div>
      <p class="message error" id="post-msg"></p>
    </article>

    <!-- ===================== 2. 댓글 ===================== -->
    <section class="card">
      <h2>댓글 <span class="muted" id="comment-total">0</span></h2>
      <ul class="comment-list" id="comment-list"></ul>

      <form class="comment-form" id="comment-form">
        <textarea class="input" id="comment-content" maxlength="1000" placeholder="댓글을 입력하세요"></textarea>
        <button type="submit" class="btn btn-primary">등록</button>
      </form>
      <p class="message" id="comment-msg"></p>
    </section>

    <!-- ===================== 3. 다른 게시글 목록 ===================== -->
    <section class="card">
      <div class="card-header">
        <h2>게시글 목록 <span class="muted" id="post-count" style="font-size:14px;font-weight:500;"></span></h2>
      </div>
      <table class="table post-table">
        <thead>
          <tr><th class="col-num">번호</th><th>제목</th><th class="col-author">작성자</th><th class="col-date">작성일</th><th class="col-view">조회</th></tr>
        </thead>
        <tbody id="post-list-body"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
      <div class="list-toolbar">
        <form class="search-form" id="search-form">
          <select class="input" id="search-type">
            <option value="all">제목+내용</option>
            <option value="title">제목</option>
            <option value="content">내용</option>
          </select>
          <input type="text" class="input" id="search-keyword" placeholder="검색어를 입력하세요">
          <button type="submit" class="btn">검색</button>
        </form>
        <a class="btn btn-primary" href="/community/write.html">글쓰기</a>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/layout.js"></script>
  <script src="/community/post-list.js"></script>
  <script src="/community/post.js"></script>
</body>
</html>
