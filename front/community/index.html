<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갓생 타이머 - 커뮤니티</title>
  <link rel="stylesheet" href="/common/style.css">
</head>
<body>
  <main class="gt-main community-layout">

    <!-- ===================== 게시글 목록 ===================== -->
    <section class="card">
      <div class="card-header">
        <h2>커뮤니티 <span class="muted" id="post-count" style="font-size:14px;font-weight:500;"></span></h2>
      </div>

      <table class="table post-table">
        <thead>
          <tr><th class="col-num">번호</th><th>제목</th><th class="col-author">작성자</th><th class="col-date">작성일</th><th class="col-view">조회</th></tr>
        </thead>
        <tbody id="post-list-body"></tbody>
      </table>

      <div class="pagination" id="pagination"></div>

      <!-- 검색 + 글쓰기 -->
      <div class="list-toolbar">
        <form class="search-form" id="search-form">
          <select class="input" id="search-type">
            <option value="all">제목+내용</option>
            <option value="title">제목</option>
            <option value="content">내용</option>
          </select>
          <input type="text" class="input" id="search-keyword" placeholder="검색어를 입력하세요">
          <button type="submit" class="btn">검색</button>
        </form>
        <a class="btn btn-primary" href="/community/write.html">글쓰기</a>
      </div>
    </section>

    <!-- ===================== 순공시간 랭킹 ===================== -->
    <aside class="card ranking-card">
      <div class="card-header">
        <h2>🔥 순공 랭킹</h2>
      </div>
      <div class="range-buttons" style="margin-bottom:12px;">
        <button type="button" class="btn btn-sm active" data-period="today">오늘</button>
        <button type="button" class="btn btn-sm" data-period="week">이번 주</button>
      </div>
      <ol class="rank-list" id="rank-list"></ol>
      <p class="muted empty-text hidden" id="rank-empty">아직 기록이 없습니다. 첫 번째 갓생러가 되어 보세요!</p>
    </aside>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/layout.js"></script>
  <script src="/community/post-list.js"></script>
  <script src="/community/community.js"></script>
</body>
</html>
