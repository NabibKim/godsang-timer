<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갓생 타이머 - 마이페이지</title>
  <link rel="stylesheet" href="/common/style.css">
</head>
<body>
  <main class="gt-main">

    <!-- ===================== 0. 비밀번호 재확인 ===================== -->
    <section class="card verify-card hidden" id="verify-section">
      <h2>🔒 비밀번호 확인</h2>
      <p class="muted">개인정보 보호를 위해 비밀번호를 한 번 더 입력해 주세요.</p>
      <form id="verify-form">
        <div class="input-row">
          <input type="password" class="input" id="verify-pw" placeholder="비밀번호" autocomplete="current-password">
          <button type="submit" class="btn btn-primary">확인</button>
        </div>
        <p class="message" id="verify-msg"></p>
      </form>
    </section>

    <div class="hidden" id="mypage-section">
      <div class="mypage-grid">
        <!-- ===================== 1. 개인정보 수정 ===================== -->
        <section class="card">
          <h2>개인정보</h2>
          <form id="profile-form" autocomplete="off">
            <div class="form-group">
              <label for="profile-id">아이디</label>
              <div class="input-row">
                <input type="text" class="input" id="profile-id" maxlength="20">
                <button type="button" class="btn" id="btn-check-id">중복확인</button>
              </div>
              <p class="hint" id="hint-id"></p>
            </div>
            <div class="form-group">
              <label for="profile-name">이름</label>
              <div class="input-row">
                <input type="text" class="input" id="profile-name" maxlength="10">
                <button type="button" class="btn" id="btn-check-name">중복확인</button>
              </div>
              <p class="hint" id="hint-name"></p>
            </div>
            <p class="muted" style="font-size:13px;">가입일 <span id="profile-created"></span></p>
            <button type="submit" class="btn btn-primary btn-block">정보 수정</button>
            <p class="message" id="profile-msg"></p>
          </form>
        </section>

        <!-- ===================== 2. 비밀번호 변경 ===================== -->
        <section class="card">
          <h2>비밀번호 변경</h2>
          <form id="password-form" autocomplete="off">
            <div class="form-group">
              <label for="pw-current">현재 비밀번호</label>
              <input type="password" class="input" id="pw-current" autocomplete="current-password">
            </div>
            <div class="form-group">
              <label for="pw-new">새 비밀번호</label>
              <input type="password" class="input" id="pw-new" placeholder="영문+숫자 포함 8자 이상" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="pw-new2">새 비밀번호 확인</label>
              <input type="password" class="input" id="pw-new2" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">비밀번호 변경</button>
            <p class="message" id="password-msg"></p>
          </form>
        </section>
      </div>

      <!-- ===================== 3. 내 활동 ===================== -->
      <section class="card">
        <div class="tabs activity-tabs">
          <button type="button" class="active" data-tab="posts">내가 쓴 글 <span id="my-post-count"></span></button>
          <button type="button" data-tab="comments">내가 쓴 댓글 <span id="my-comment-count"></span></button>
        </div>

        <table class="table" id="my-posts-table">
          <thead><tr><th>제목</th><th class="col-date">작성일</th><th class="col-view">댓글</th><th class="col-view">조회</th></tr></thead>
          <tbody id="my-posts-body"></tbody>
        </table>

        <table class="table hidden" id="my-comments-table">
          <thead><tr><th>댓글 내용</th><th>원 게시글</th><th class="col-date">작성일</th></tr></thead>
          <tbody id="my-comments-body"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/layout.js"></script>
  <script src="/mypage/mypage.js"></script>
</body>
</html>
